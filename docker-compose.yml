services:
  db:
    image: postgres:16
    container_name: bd_dismatec
    restart: unless-stopped
    environment:
      POSTGRES_DB: DISMATEC
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dismatec_postgres_data:/var/lib/postgresql/data

volumes:
  dismatec_postgres_data:
